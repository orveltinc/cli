name: Verify CLI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      - run: bun run test
      - name: Verify OAuth with Node
        run: ORVELT_CLI_TEST_RUNTIME="$(node -p process.execPath)" bun run test-integration
      - name: Verify installed runtime compatibility
        run: bun run test:compatibility
      - run: bun audit
      - name: Pack verified CLI
        run: |
          mkdir -p test/results
          bun pm pack --ignore-scripts --filename "$PWD/test/results/orvelt-cli.tgz"
      - name: Test installed package
        run: |
          CONSUMER="$(mktemp -d)"
          printf '{"private":true}\n' > "$CONSUMER/package.json"
          cd "$CONSUMER"
          bun add --ignore-scripts "$GITHUB_WORKSPACE/test/results/orvelt-cli.tgz"
          ORVELT_CLI_TEST_EXECUTABLE="$CONSUMER/node_modules/@orvelt/cli/dist/index.js" \
            bun test "$GITHUB_WORKSPACE/test/integration" --timeout 30000
      - uses: actions/upload-artifact@v4
        with:
          name: orvelt-cli
          path: test/results/orvelt-cli.tgz
          if-no-files-found: error
