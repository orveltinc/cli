name: Publish CLI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/verify.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: orvelt-cli
          path: test/results
      - name: Require the standalone main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - name: Publish the verified archive with npm trusted publishing
        run: npm publish ./test/results/orvelt-cli.tgz --access public --ignore-scripts --tag latest
